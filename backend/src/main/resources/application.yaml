spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acquisition}
    username: ${POSTGRES_USER:acquisition}
    password: ${POSTGRES_PASSWORD:acquisition}
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Reject request fields the API does not define (e.g. a label or a hidden feature).
      fail-on-unknown-properties: true

acquisition:
  # Paths are relative to the working directory (the backend module when run from Maven or IntelliJ).
  feature-config: ${FEATURE_CONFIG:../config/feature-groups.json}
  scenario-config: ${SCENARIO_CONFIG:../config/scenarios/default.json}
  dataset:
    # DEVELOPMENT reads validation records. FINAL_EVALUATION reads test records and is only
    # accepted together with the "final-evaluation" Spring profile.
    access-mode: ${DATASET_ACCESS_MODE:DEVELOPMENT}
    features-dir: ${DATASET_FEATURES_DIR:../data/features}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout: 1s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
